<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darrieus Turbine Visualiser</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { 
            font-family: 'Roboto Mono', monospace; 
            background: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            overflow: hidden; 
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        .nav { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 10; 
            color: #fff; 
            text-decoration: none; 
            background: rgba(255, 255, 255, 0.1); 
            padding: 10px 15px; 
            border-radius: 6px; 
            font-weight: bold;
        }
        .nav:hover { background: rgba(255, 255, 255, 0.2); }
        
        #ui-layer { 
            position: absolute; 
            bottom: 0; 
            width: 100%; 
            padding: 30px 20px; 
            background: linear-gradient(transparent, rgba(18, 18, 18, 0.95) 40%); 
            z-index: 10; 
            display: flex; 
            justify-content: space-evenly; 
            align-items: center; 
            box-sizing: border-box;
        }
        .control-group { text-align: center; }
        label { 
            display: block; 
            font-size: 0.8rem; 
            color: #aaa; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }
        .val { font-size: 1.4rem; font-weight: bold; color: #fff; }
        
        input[type=range] { 
            width: 180px; 
            cursor: pointer; 
            accent-color: #ffffff;
        }
        
        /* Custom Toggle Switch */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4CAF50; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>
    <a href="index.html" class="nav">← Back to Menu</a>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="control-group">
            <label>Highlight Struts</label>
            <label class="switch">
              <input type="checkbox" id="strutToggle">
              <span class="slider"></span>
            </label>
        </div>
        <div class="control-group">
            <label>Wind Speed</label>
            <div class="val"><span id="windVal">4.0</span> m/s</div>
        </div>
        <div class="control-group">
            <label>Adjust Speed</label>
            <input type="range" id="windSlider" min="0" max="20" step="0.1" value="4.0">
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog('#121212', 5, 15);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 7);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        // Proper Lighting for the solid look
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const group = new THREE.Group();
        
        // Sleek Solid Materials
        const matMetal = new THREE.MeshStandardMaterial({ color: 0xa0a0a0, roughness: 0.4, metalness: 0.6 });
        const matHighlight = new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 0.2, metalness: 0.3, emissive: 0x113311 });
        const matConcrete = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9, metalness: 0.1 });
        
        // Concrete Base Plinth
        const baseGeo = new THREE.CylinderGeometry(1.2, 1.5, 0.4, 32);
        const base = new THREE.Mesh(baseGeo, matConcrete);
        base.position.y = -2.2;
        scene.add(base);

        const pillarGeo = new THREE.CylinderGeometry(0.3, 0.5, 0.6, 32);
        const pillar = new THREE.Mesh(pillarGeo, matConcrete);
        pillar.position.y = -1.7;
        scene.add(pillar);

        // Central Shaft
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4, 16), matMetal);
        group.add(shaft);
        
        // Outer Curved Blades (Two intersecting loops for a fuller shape)
        const curve = new THREE.EllipseCurve(0, 0, 1.5, 2, 0, Math.PI, false, 0);
        const points = curve.getPoints(50);
        const bladeGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p.x, p.y, 0))), 64, 0.04, 16, false);
        
        const b1 = new THREE.Mesh(bladeGeo, matMetal); 
        b1.rotation.z = Math.PI/2; 
        group.add(b1);
        
        const b2 = new THREE.Mesh(bladeGeo, matMetal); 
        b2.rotation.z = Math.PI/2; 
        b2.rotation.x = Math.PI/2; 
        group.add(b2);

        // Acoustic Struts (Crossed)
        const struts = [];
        const strutGeo = new THREE.CylinderGeometry(0.03, 0.03, 3, 16);
        
        const s1 = new THREE.Mesh(strutGeo, matMetal);
        s1.rotation.z = Math.PI/2;
        struts.push(s1);
        group.add(s1);

        const s2 = new THREE.Mesh(strutGeo, matMetal);
        s2.rotation.z = Math.PI/2;
        s2.rotation.x = Math.PI/2;
        struts.push(s2);
        group.add(s2);

        scene.add(group);

        // Interactivity
        let speed = 4.0;
        document.getElementById('windSlider').addEventListener('input', (e) => {
            speed = parseFloat(e.target.value);
            document.getElementById('windVal').innerText = speed.toFixed(1);
        });
        
        document.getElementById('strutToggle').addEventListener('change', (e) => {
            struts.forEach(s => s.material = e.target.checked ? matHighlight : matMetal);
        });

        // Animation Loop
        function animate() { 
            requestAnimationFrame(animate); 
            group.rotation.y += (speed * 0.015); 
            renderer.render(scene, camera); 
        }
        animate();
        
        // Keep it responsive
        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        });
    </script>
</body>
</html>
