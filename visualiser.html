<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darrieus Turbine Visualiser</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { font-family: 'Roboto Mono', monospace; background: #050505; color: #e0e0e0; margin: 0; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .nav { position: absolute; top: 20px; left: 20px; z-index: 10; color: #fff; text-decoration: none; background: rgba(50, 57, 241, 0.1); border: 1px solid #3239f1; padding: 10px 15px; border-radius: 6px; font-weight: bold; transition: 0.3s ease; }
        .nav:hover { background: #3239f1; }
        
        #ui-layer { 
            position: absolute; bottom: 0; width: 100%; padding: 20px; 
            background: linear-gradient(transparent, rgba(5, 5, 5, 0.95) 30%); 
            z-index: 10; display: flex; flex-wrap: wrap; justify-content: space-evenly; align-items: flex-end; gap: 15px;
        }
        .control-group { text-align: center; min-width: 120px; margin-bottom: 10px; }
        label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .val { font-size: 1.4rem; font-weight: bold; color: #d8756f; margin-bottom: 5px; }
        input[type=range] { width: 100%; max-width: 150px; cursor: pointer; accent-color: #3239f1; }
        
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #3239f1; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>
    <a href="index.html" class="nav">← Back to Menu</a>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="control-group">
            <label>Highlight</label>
            <label class="switch">
              <input type="checkbox" id="strutToggle">
              <span class="slider"></span>
            </label>
        </div>
        <div class="control-group">
            <label>Wind Speed</label>
            <div class="val"><span id="windVal">15.0</span> m/s</div>
            <input type="range" id="windSlider" min="0" max="30" step="0.1" value="15.0">
        </div>
        <div class="control-group">
            <label>Rotation</label>
            <div class="val"><span id="rpmVal">180.0</span> RPM</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog('#050505', 5, 18);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 8.5);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const group = new THREE.Group();
        
        const matMetal = new THREE.MeshStandardMaterial({ color: 0xa0a0a0, roughness: 0.4, metalness: 0.6 });
        const matHighlight = new THREE.MeshStandardMaterial({ color: 0x3239f1, roughness: 0.2, metalness: 0.3, emissive: 0x111133 });
        const matConcrete = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9, metalness: 0.1 });
        
        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.5, 0.4, 32), matConcrete);
        base.position.y = -2.2;
        scene.add(base);

        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 0.6, 32), matConcrete);
        pillar.position.y = -1.7;
        scene.add(pillar);

        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3, 16), matMetal);
        group.add(shaft);
        
        const points = [];
        for ( let i = 0; i <= 20; i ++ ) {
            const t = i / 20; 
            const y = 1.5 * Math.cos( t * Math.PI ); 
            const x = 1.5 * Math.sin( t * Math.PI ); 
            points.push( new THREE.Vector3( x, y, 0 ) );
        }
        const bladePath = new THREE.CatmullRomCurve3(points);
        const bladeGeo = new THREE.TubeGeometry(bladePath, 64, 0.04, 16, false);
        
        for (let i = 0; i < 4; i++) {
            const blade = new THREE.Mesh(bladeGeo, matMetal);
            blade.rotation.y = (Math.PI / 2) * i;
            group.add(blade);
        }

        const struts = [];
        const strutGeo = new THREE.CylinderGeometry(0.03, 0.03, 3, 16);
        
        const s1 = new THREE.Mesh(strutGeo, matMetal);
        s1.rotation.z = Math.PI / 2;
        struts.push(s1);
        group.add(s1);

        const s2 = new THREE.Mesh(strutGeo, matMetal);
        s2.rotation.x = Math.PI / 2;
        struts.push(s2);
        group.add(s2);

        scene.add(group);

        let speed = 15.0;

        document.getElementById('windSlider').addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            const rpm = v * 12; // Maintains the 12x ratio
            
            document.getElementById('windVal').innerText = v.toFixed(1);
            document.getElementById('rpmVal').innerText = rpm.toFixed(1);
            
            speed = v;
        });
        
        document.getElementById('strutToggle').addEventListener('change', (e) => {
            struts.forEach(s => s.material = e.target.checked ? matHighlight : matMetal);
        });

        function animate() { 
            requestAnimationFrame(animate); 
            group.rotation.y -= (speed * 0.015); 
            renderer.render(scene, camera); 
        }
        animate();
        
        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        });
    </script>
</body>
</html>
