<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coastal Acoustic Mediator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <style>
        body { font-family: 'Roboto Mono', monospace; background: #050505; color: #e0e0e0; margin: 0; padding: 20px; }
        .controls { background: #111; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        input[type=range] { width: 80%; max-width: 400px; margin: 20px 0; accent-color: #3239f1; cursor: pointer; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1.2fr; } }
        .card { background: #111; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; }
        
        /* Style for both video and image to match perfectly */
        video, #imageViewer { width: 100%; border-radius: 4px; background: #000; flex-grow: 1; object-fit: contain; }
        
        .nav { margin-bottom: 20px; display: inline-block; color: #3239f1; text-decoration: none; font-weight: bold; }
        h2, h3 { color: #d8756f; margin-top: 0; }
        
        .readouts { display: flex; justify-content: space-around; margin-top: 25px; padding-top: 20px; border-top: 1px solid #333; }
        .readout-box { text-align: center; }
        .readout-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .readout-val { font-size: 1.2rem; font-weight: bold; color: #e0e0e0; }
    </style>
</head>
<body>
    <a href="index.html" class="nav">← Back to Menu</a>
    <div class="controls">
        <h2 id="timeTitle">06:00</h2>
        <input type="range" id="timeSlider" min="0" max="3" step="1" value="0">
    </div>

    <div class="grid">
        <div class="card">
            <h3>Site Animation</h3>
            <!-- Video Player for the first 3 states -->
            <video id="animPlayer" autoplay loop muted playsinline>
                <source src="morning.mp4" type="video/mp4">
            </video>
            <!-- Image Viewer for the night state, hidden by default -->
            <img id="imageViewer" src="night.jpg" style="display: none;" alt="Night time acoustic void">
        </div>
        <div class="card">
            <h3>Acoustic Spectrum (Hz)</h3>
            <canvas id="freqChart" style="max-height: 350px;"></canvas>
            
            <div class="readouts">
                <div class="readout-box">
                    <div class="readout-label">Active Band</div>
                    <div class="readout-val" id="activeBandVal">3kHz (Birds)</div>
                </div>
                <div class="readout-box">
                    <div class="readout-label">Target Effect</div>
                    <div class="readout-val" id="targetEffectVal" style="color: #d8756f;">Ecological Beacon</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const states = [
            { 
                time: "06:00", effect: "Ecological Beacon", band: "3kHz (Birds)", 
                media: "morning.mp4", type: "video", xMin: 2000, xMax: 5000, showBox: true 
            },
            { 
                time: "12:00", effect: "Communal Sanctuary", band: "120Hz (Sharks)", 
                media: "midday.mp4", type: "video", xMin: 20, xMax: 150, showBox: true 
            },
            { 
                time: "16:00", effect: "Hazard Tone", band: "60Hz (Tone)", 
                media: "afternoon.mp4", type: "video", xMin: 50, xMax: 300, showBox: true 
            },
            { 
                time: "21:00", effect: "Acoustic Void", band: "20Hz (Waves)", 
                media: "night.jpg", type: "image", showBox: false 
            }
        ];

        const ctx = document.getElementById('freqChart').getContext('2d');
        
        const baselineData = [
            {x: 10, y: 50}, {x: 20, y: 48}, {x: 50, y: 49}, {x: 100, y: 45}, 
            {x: 200, y: 47}, {x: 500, y: 41}, {x: 1000, y: 43}, {x: 2000, y: 35}, 
            {x: 5000, y: 37}, {x: 10000, y: 25}, {x: 20000, y: 18}
        ];

        const freqChart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Baseline Acoustic Amplitude',
                    data: baselineData,
                    borderColor: '#3239f1',
                    borderWidth: 3,
                    fill: false,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'logarithmic',
                        min: 10,
                        max: 20000,
                        grid: { color: '#222' },
                        ticks: {
                            color: '#888',
                            callback: function(value) {
                                const allowedTicks = [10, 20, 100, 200, 1000, 2000, 10000, 20000];
                                if (allowedTicks.includes(value)) {
                                    return value >= 1000 ? (value / 1000) + 'k' : value;
                                }
                                return null;
                            }
                        }
                    },
                    y: {
                        min: 0,
                        max: 80,
                        grid: { color: '#222' },
                        ticks: { color: '#888' },
                        title: { display: true, text: 'Ambient Amplitude (dB)', color: '#888' }
                    }
                },
                plugins: {
                    legend: { display: false },
                    annotation: {
                        annotations: {
                            highlightBox: {
                                type: 'box',
                                xMin: 2000,
                                xMax: 5000,
                                backgroundColor: 'rgba(50, 57, 241, 0.25)',
                                borderColor: '#3239f1',
                                borderWidth: 1,
                                label: {
                                    display: true,
                                    content: ['Avian Lure', '(2-5 kHz)'],
                                    color: '#d8756f',
                                    position: 'start',
                                    font: { family: 'Roboto Mono', size: 12, weight: 'bold' }
                                }
                            }
                        }
                    }
                }
            }
        });

        document.getElementById('timeSlider').addEventListener('input', (e) => {
            const state = states[e.target.value];
            
            document.getElementById('timeTitle').innerText = state.time;
            document.getElementById('activeBandVal').innerText = state.band;
            document.getElementById('targetEffectVal').innerText = state.effect;
            
            const player = document.getElementById('animPlayer');
            const imgViewer = document.getElementById('imageViewer');
            
            if (state.type === 'video') {
                player.style.display = 'block';
                imgViewer.style.display = 'none';
                player.src = state.media;
                player.play();
            } else {
                player.style.display = 'none';
                imgViewer.style.display = 'block';
                imgViewer.src = state.media;
                player.pause();
            }

            const box = freqChart.options.plugins.annotation.annotations.highlightBox;
            if (state.showBox) {
                box.xMin = state.xMin;
                box.xMax = state.xMax;
                box.label.content = [state.effect, state.band];
                box.backgroundColor = 'rgba(50, 57, 241, 0.25)';
                box.borderColor = '#3239f1';
            } else {
                box.backgroundColor = 'rgba(0, 0, 0, 0)';
                box.borderColor = 'rgba(0, 0, 0, 0)';
                box.label.content = [];
            }
            freqChart.update();
        });
    </script>
</body>
</html>
